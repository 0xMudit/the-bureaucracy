name: Ingest the wire

on:
  schedule:
    # Every 15 minutes. GitHub Actions can be delayed under load; the site also
    # refreshes itself and the endpoint is safe to call again.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: wire-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger /api/ingest
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://the-bureaucracy.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          echo "Ingesting $SITE_URL"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 90 \
            -X POST "$SITE_URL/api/ingest" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
