name: Deploy production

# The Vercel project is not Git-linked (its Git identity has no access to this
# repo), so production deploys are driven from here instead of from Vercel's
# own Git integration. Each push deploys the exact commit that was pushed.
on:
  push:
    branches: [release/prod-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keeps the run green (with a visible notice) until the token is added,
      # so the first push of this workflow doesn't fail red for no reason.
      - name: Check for deploy token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::VERCEL_TOKEN is not set. Add it with: gh secret set VERCEL_TOKEN --repo ${{ github.repository }}"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_48zutnuKuVxihRS0206bWhRO
          VERCEL_PROJECT_ID: prj_eOV6qEFetG3wtyNhutxQV1QKEkNy
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
